<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prihlásenie - Kto ide so psom</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">🐾 Prihlásenie</h1>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">E-mail</label>
                <input type="email" id="loginEmail" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Heslo</label>
                <input type="password" id="loginPassword" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 transition">
                Prihlásiť sa
            </button>
        </form>

        <div id="errorMessage" class="mt-4 text-center text-sm font-medium text-red-600"></div>

        <div class="mt-6 text-center text-sm">
            <span class="text-gray-600">Ešte nemáš účet?</span> 
            <a href="register.html" class="text-indigo-600 font-semibold hover:underline">Zaregistrovať sa</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiXQt7bHPI15wp4krGq-GwPz7BfsSvaEE",
            authDomain: "ktoidezopsom.firebaseapp.com",
            databaseURL: "https://ktoidezopsom-default-rtdb.firebaseio.com",
            projectId: "ktoidezopsom",
            storageBucket: "ktoidezopsom.firebasestorage.app",
            messagingSenderId: "354613832067",
            appId: "1:354613832067:web:ddf12b03ed6b4a61d8aeb6",
            measurementId: "G-Z8YC2L3RK7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    errorMessage.textContent = "Nesprávny e-mail alebo heslo.";
                });
        });
    </script>
</body>
</html>
