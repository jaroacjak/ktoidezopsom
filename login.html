<!DOCTYPE html><html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kto ide so psom? – Prihlásenie</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        color: #1e293b;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 430px;
    }

    .box {
        background: white;
        border-radius: 20px;
        padding: 40px 35px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        border: 1px solid #e2e8f0;
    }

    .logo {
        text-align: center;
        margin-bottom: 28px;
    }

    .logo-icon {
        width: 75px;
        height: 75px;
        margin: 0 auto 15px;
        border-radius: 21px;
        background: #e8f0fe;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
    }

    .logo h1 {
        font-size: 26px;
        margin-bottom: 7px;
    }

    .logo p {
        color: #64748b;
        font-size: 14px;
    }

    .message {
        display: none;
        padding: 11px;
        border-radius: 8px;
        margin-bottom: 18px;
        font-size: 14px;
        text-align: center;
    }

    .error {
        background: #fee2e2;
        color: #b91c1c;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 50px;
    }

    .show-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
    }

    .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 4px 0 20px;
        font-size: 13px;
    }

    .remember {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #64748b;
    }

    .remember input {
        width: auto;
    }

    .forgot {
        color: #2563eb;
        text-decoration: none;
    }

    .forgot:hover {
        text-decoration: underline;
    }

    .login-button {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 9px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .login-button:hover {
        background: #1d4ed8;
    }

    .register {
        text-align: center;
        margin-top: 23px;
        color: #64748b;
        font-size: 14px;
    }

    .register a {
        color: #2563eb;
        font-weight: bold;
        text-decoration: none;
    }

    .register a:hover {
        text-decoration: underline;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: #64748b;
        text-decoration: none;
        font-size: 13px;
    }

    .back:hover {
        color: #2563eb;
    }

    footer {
        text-align: center;
        margin-top: 20px;
        color: #94a3b8;
        font-size: 12px;
    }

    @media (max-width: 480px) {
        .box {
            padding: 30px 20px;
        }

        .options {
            align-items: flex-start;
            gap: 10px;
            flex-direction: column;
        }
    }
</style>

</head><body><div class="container"><div class="box">

    <div class="logo">

        <div class="logo-icon">
            🐶
        </div>

        <h1>Prihlásenie</h1>

        <p>
            Prihláste sa do aplikácie Kto ide so psom?
        </p>

    </div>


    <div id="errorMessage" class="message error">
        Nesprávne prihlasovacie údaje.
    </div>


    <form id="loginForm">

        <div class="form-group">

            <label for="username">
                Používateľské meno alebo e-mail
            </label>

            <input
                type="text"
                id="username"
                placeholder="Zadajte používateľské meno"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Heslo
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Zadajte heslo"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                    aria-label="Zobraziť heslo"
                >
                    👁️
                </button>

            </div>

        </div>


        <div class="options">

            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                Zapamätať prihlásenie

            </label>

            <a
                href="#"
                class="forgot"
                onclick="forgotPassword(event)"
            >
                Zabudol som heslo
            </a>

        </div>


        <button
            type="submit"
            class="login-button"
        >
            Prihlásiť sa
        </button>

    </form>


    <div class="register">

        Nemáte ešte účet?

        <a href="register.html">
            Registrovať sa
        </a>

    </div>


    <a href="index.html" class="back">
        ← Späť na úvod
    </a>

</div>


<footer>
    © 2026 Kto ide so psom?
</footer>

</div><script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        if (password.type === "password") {

            password.type = "text";

        } else {

            password.type = "password";

        }
    }


    function forgotPassword(event) {

        event.preventDefault();

        alert(
            "Obnovenie hesla doplníme po pripojení databázy."
        );
    }


    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("errorMessage");


            error.style.display = "none";


            /*
                ZATIAĽ TESTOVACIE PRIHLÁSENIE.

                Skutočné prihlasovanie doplníme neskôr
                pomocou databázy/backendu.
            */

            if (username === "admin" && password === "admin") {

                alert("Admin účet bude doplnený neskôr.");

            } else if (username === "user" && password === "user") {

                alert("Používateľský účet bude doplnený neskôr.");

            } else {

                error.textContent =
                    "Nesprávne používateľské meno alebo heslo.";

                error.style.display = "block";

            }

        });

</script></body>
</html>
