<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kto ide so psom</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- KARTA 1: Pridanie venčenia -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">🐾 Admin: Správa venčení</h1>
            
            <form id="dogForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Dátum a čas venčenia</label>
                    <input type="datetime-local" id="dateTime" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Meno venčiara (Kto?)</label>
                    <input type="text" id="personName" placeholder="napr. Jarko / Andrej Ačjak" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Meno psa (So psom?)</label>
                    <input type="text" id="dogName" placeholder="napr. Rex" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 transition">
                    Pridať záznam venčenia
                </button>
            </form>

            <div id="statusMessage" class="mt-2 text-center text-sm font-medium"></div>
        </div>

        <!-- KARTA 2: Správa identifikácie (Mapovanie Email -> Meno) -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 border-2 border-indigo-100">
            <h2 class="text-xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                <span>🆔 Nastavenie identifikácie venčiarov</span>
            </h2>
            <p class="text-xs text-gray-500 mb-4">Priraď e-mailové adresy alebo ich časti k menám, ktoré zadávaš do rozpisu venčení.</p>

            <form id="identityForm" class="space-y-3 mb-6 bg-indigo-50 p-3.5 rounded-lg border border-indigo-100">
                <div>
                    <label class="block text-xs font-semibold text-gray-700">E-mail (alebo časť e-mailu)</label>
                    <input type="text" id="identEmail" placeholder="napr. andrej@gmail.com alebo acjak" required class="mt-1 block w-full text-xs rounded-md border-gray-300 border p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700">Meno/Mená v databáze (oddelené čiarkou)</label>
                    <input type="text" id="identNames" placeholder="napr. Andrej, Andrej Ačjak" required class="mt-1 block w-full text-xs rounded-md border-gray-300 border p-2">
                </div>
                <button type="submit" class="w-full bg-indigo-800 text-white font-medium py-1.5 text-xs rounded-md hover:bg-indigo-900 transition">
                    Uložiť / Upraviť identifikáciu
                </button>
            </form>

            <!-- Zoznam existujúcich identifikácií -->
            <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide mb-2">Uložené pravidlá identifikácie:</h3>
            <div id="identitiesList" class="space-y-2">
                <p class="text-gray-500 text-xs">Načítavam pravidlá...</p>
            </div>
        </div>

        <!-- KARTA 3: Zoznam naplánovaných venčení -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Aktuálny rozpis (Oprava a Úpravy Adminom)</h2>
            <div id="adminWalksList" class="space-y-4">
                <p class="text-gray-500 text-sm">Načítavam dáta...</p>
            </div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiXQt7bHPI15wp4krGq-GwPz7BfsSvaEE",
            authDomain: "ktoidezopsom.firebaseapp.com",
            databaseURL: "https://ktoidezopsom-default-rtdb.firebaseio.com",
            projectId: "ktoidezopsom",
            storageBucket: "ktoidezopsom.firebasestorage.app",
            messagingSenderId: "354613832067",
            appId: "1:354613832067:web:ddf12b03ed6b4a61d8aeb6",
            measurementId: "G-Z8YC2L3RK7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('dogForm');
        const identityForm = document.getElementById('identityForm');
        const statusMessage = document.getElementById('statusMessage');
        const walksList = document.getElementById('adminWalksList');
        const identitiesList = document.getElementById('identitiesList');

        // Pridanie nového záznamu venčenia
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const dateTime = document.getElementById('dateTime').value;
            const person = document.getElementById('personName').value;
            const dog = document.getElementById('dogName').value;

            push(ref(db, 'walks'), {
                dateTime: dateTime,
                person: person,
                dog: dog,
                status: 'ok',
                substitute: '',
                lateTime: '',
                createdAt: Date.now()
            }).then(() => {
                statusMessage.textContent = "Záznam úspešne pridaný!";
                statusMessage.className = "mt-2 text-center text-sm font-medium text-green-600";
                form.reset();
                setTimeout(() => statusMessage.textContent = "", 3000);
            }).catch((error) => {
                statusMessage.textContent = "Chyba: " + error.message;
                statusMessage.className = "mt-2 text-center text-sm font-medium text-red-600";
            });
        });

        // Uloženie/Úprava identifikácie (mapovania)
        identityForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const emailKey = document.getElementById('identEmail').value.trim().toLowerCase().replace(/[.#$\[\]]/g, "_");
            const rawEmail = document.getElementById('identEmail').value.trim().toLowerCase();
            const namesArray = document.getElementById('identNames').value.split(',').map(n => n.trim().toLowerCase()).filter(n => n.length > 0);

            if (!rawEmail || namesArray.length === 0) {
                alert("Vyplň e-mail aj aspoň jedno meno.");
                return;
            }

            set(ref(db, 'identities/' + emailKey), {
                emailMatch: rawEmail,
                mappedNames: namesArray
            }).then(() => {
                identityForm.reset();
            });
        });

        // Živé načítanie pravidiel identifikácie
        onValue(ref(db, 'identities'), (snapshot) => {
            identitiesList.innerHTML = '';
            const data = snapshot.val();
            
            if (!data) {
                identitiesList.innerHTML = '<p class="text-gray-400 text-xs">Zatiaľ nie sú pridané žiadne vlastné pravidlá. (Aplikácia používa výchozie pravidlá pre Jarka/Andreja).</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                const item = data[key];
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 p-2 rounded border text-xs";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-800">${item.emailMatch}</span>
                        <span class="text-gray-400 font-normal"> ➔ </span>
                        <span class="text-indigo-600 font-semibold">${item.mappedNames.join(', ')}</span>
                    </div>
                    <button onclick="deleteIdentity('${key}')" class="text-red-500 hover:text-red-700 font-bold px-2 py-0.5">✕</button>
                `;
                identitiesList.appendChild(div);
            });
        });

        window.deleteIdentity = function(key) {
            if (confirm("Chceš vymazať toto pravidlo identifikácie?")) {
                remove(ref(db, 'identities/' + key));
            }
        }

        // Živé načítavanie venčení
        onValue(ref(db, 'walks'), (snapshot) => {
            walksList.innerHTML = '';
            const data = snapshot.val();
            if (!data) {
                walksList.innerHTML = '<p class="text-gray-500 text-sm">Žiadne naplánované venčenia.</p>';
                return;
            }

            const walksArray = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            })).sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

            walksArray.forEach((walk) => {
                const dateFormatted = new Date(walk.dateTime).toLocaleString('sk-SK', {
                    weekday: 'short', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                
                let statusControlHtml = '';

                if (walk.status === 'substituted') {
                    statusControlHtml = `
                        <div class="mt-2 pt-2 border-t border-green-200 bg-green-50 p-2.5 rounded flex justify-between items-center">
                            <span class="text-xs text-green-800 font-medium">✓ Supluje: <b>${walk.substitute}</b> (pôvodne ${walk.person})</span>
                            <button onclick="adminResetStatus('${walk.id}')" class="text-xs text-red-600 hover:underline font-semibold">Zrušiť / Opraviť suplovanie</button>
                        </div>
                    `;
                } else if (walk.status === 'late') {
                    statusControlHtml = `
                        <div class="mt-2 pt-2 border-t border-purple-200 bg-purple-50 p-2.5 rounded flex justify-between items-center">
                            <span class="text-xs text-purple-800 font-medium">⏰ Príde neskôr: <b>${walk.lateTime}</b></span>
                            <button onclick="adminResetStatus('${walk.id}')" class="text-xs text-red-600 hover:underline font-semibold">Zrušiť meškanie</button>
                        </div>
                    `;
                } else {
                    statusControlHtml = `
                        <div class="mt-2 pt-2 border-t border-gray-100 flex flex-col gap-2">
                            <div class="flex justify-between items-center">
                                <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-medium">Stav: Všetko OK</span>
                                <div class="flex gap-1">
                                    <button onclick="toggleBox('${walk.id}', 'sub')" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 px-2.5 py-1 rounded transition">Priradiť suplu</button>
                                    <button onclick="toggleBox('${walk.id}', 'late')" class="text-xs bg-purple-100 hover:bg-purple-200 text-purple-800 px-2.5 py-1 rounded transition">Príde neskôr</button>
                                </div>
                            </div>
                            
                            <div id="subBox-${walk.id}" class="hidden flex gap-2 items-center mt-1">
                                <input type="text" id="adminSubInput-${walk.id}" placeholder="Meno suplujúceho (napr. Andrej)" class="text-xs p-1.5 border rounded w-full">
                                <button onclick="adminSaveSub('${walk.id}')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded font-medium whitespace-nowrap">Uložiť suplu</button>
                            </div>

                            <div id="lateBox-${walk.id}" class="hidden flex gap-2 items-center mt-1">
                                <input type="text" id="adminLateInput-${walk.id}" placeholder="Napr. o 15 min / o 17:30" class="text-xs p-1.5 border rounded w-full">
                                <button onclick="adminSaveLate('${walk.id}')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-3 py-1.5 rounded font-medium whitespace-nowrap">Uložiť čas</button>
                            </div>
                        </div>
                    `;
                }

                const item = document.createElement('div');
                item.className = "bg-gray-50 p-4 rounded-lg border flex flex-col gap-1";
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-xs text-indigo-600 font-semibold">${dateFormatted}</div>
                            <div class="text-base font-bold text-gray-800">👤 ${walk.person} ➔ 🐕 <span class="text-indigo-700">${walk.dog}</span></div>
                        </div>
                        <button onclick="deleteWalk('${walk.id}')" class="bg-red-500 text-white text-xs px-2.5 py-1.5 rounded hover:bg-red-600 transition">Zmazať</button>
                    </div>
                    ${statusControlHtml}
                `;
                walksList.appendChild(item);
            });
        });

        window.deleteWalk = function(id) {
            if (confirm("Naozaj chceš vymazať tento záznam z databázy?")) {
                remove(ref(db, 'walks/' + id));
            }
        }

        window.toggleBox = function(id, type) {
            const subBox = document.getElementById(`subBox-${id}`);
            const lateBox = document.getElementById(`lateBox-${id}`);
            
            if (type === 'sub') {
                subBox.classList.toggle('hidden');
                lateBox.classList.add('hidden');
            } else {
                lateBox.classList.toggle('hidden');
                subBox.classList.add('hidden');
            }
        }

        window.adminSaveSub = function(id) {
            const name = document.getElementById(`adminSubInput-${id}`).value.trim();
            if (!name) {
                alert("Zadaj meno človeka, ktorý má suplovať.");
                return;
            }
            update(ref(db, 'walks/' + id), {
                status: 'substituted',
                substitute: name
            });
        }

        window.adminSaveLate = function(id) {
            const timeVal = document.getElementById(`adminLateInput-${id}`).value.trim();
            if (!timeVal) {
                alert("Zadaj čas meškania.");
                return;
            }
            update(ref(db, 'walks/' + id), {
                status: 'late',
                lateTime: timeVal
            });
        }

        window.adminResetStatus = function(id) {
            if (confirm("Chceš zrušiť suplovanie / meškanie a vrátiť záznam do pôvodného stavu?")) {
                update(ref(db, 'walks/' + id), {
                    status: 'ok',
                    substitute: '',
                    lateTime: ''
                });
            }
        }
    </script>
</body>
</html>
