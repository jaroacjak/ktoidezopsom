<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kto ide so psom</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">🐾 Admin: Kto ide so psom & Suplovanie</h1>
        
        <!-- Formulár na pridanie venčenia -->
        <form id="dogForm" class="space-y-4 mb-8">
            <div>
                <label class="block text-sm font-medium text-gray-700">Dátum a čas venčenia</label>
                <input type="datetime-local" id="dateTime" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Meno venčiara (Kto?)</label>
                <input type="text" id="personName" placeholder="napr. Jano" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Meno psa (So psom?)</label>
                <input type="text" id="dogName" placeholder="napr. Rex" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 transition">
                Pridať záznam
            </button>
        </form>

        <div id="statusMessage" class="mt-2 text-center text-sm font-medium mb-6"></div>

        <hr class="my-6">

        <!-- Zoznam naplánovaných venčení a suplovania -->
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Aktuálny rozpis a správa suplovania</h2>
        <div id="adminWalksList" class="space-y-4">
            <p class="text-gray-500 text-sm">Načítavam dáta...</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiXQt7bHPI15wp4krGq-GwPz7BfsSvaEE",
            authDomain: "ktoidezopsom.firebaseapp.com",
            databaseURL: "https://ktoidezopsom-default-rtdb.firebaseio.com",
            projectId: "ktoidezopsom",
            storageBucket: "ktoidezopsom.firebasestorage.app",
            messagingSenderId: "354613832067",
            appId: "1:354613832067:web:ddf12b03ed6b4a61d8aeb6",
            measurementId: "G-Z8YC2L3RK7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('dogForm');
        const statusMessage = document.getElementById('statusMessage');
        const walksList = document.getElementById('adminWalksList');

        // Pridanie nového záznamu
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const dateTime = document.getElementById('dateTime').value;
            const person = document.getElementById('personName').value;
            const dog = document.getElementById('dogName').value;

            push(ref(db, 'walks'), {
                dateTime: dateTime,
                person: person,
                dog: dog,
                status: 'ok', // ok, need_sub, substituted
                substitute: '',
                createdAt: Date.now()
            }).then(() => {
                statusMessage.textContent = "Záznam úspešne pridaný!";
                statusMessage.className = "mt-2 text-center text-sm font-medium text-green-600";
                form.reset();
                setTimeout(() => statusMessage.textContent = "", 3000);
            }).catch((error) => {
                statusMessage.textContent = "Chyba: " + error.message;
                statusMessage.className = "mt-2 text-center text-sm font-medium text-red-600";
            });
        });

        // Živé načítavanie a zobrazenie pre admina
        onValue(ref(db, 'walks'), (snapshot) => {
            walksList.innerHTML = '';
            const data = snapshot.val();
            if (!data) {
                walksList.innerHTML = '<p class="text-gray-500 text-sm">Žiadne naplánované venčenia.</p>';
                return;
            }

            const walksArray = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            })).sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

            walksArray.forEach((walk) => {
                const dateFormatted = new Date(walk.dateTime).toLocaleString('sk-SK', {
                    weekday: 'short', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                
                let subSection = '';

                if (walk.status === 'need_sub') {
                    subSection = `
                        <div class="mt-2 pt-2 border-t border-amber-200 bg-amber-50 p-2 rounded">
                            <span class="text-xs font-bold text-amber-800 block mb-1">⚠️ Hľadá sa suplovanie!</span>
                            <div class="flex gap-2 items-center">
                                <input type="text" id="adminSub-${walk.id}" placeholder="Meno suplujúceho" class="text-xs p-1.5 border rounded w-full">
                                <button onclick="adminTakeSub('${walk.id}')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded font-medium whitespace-nowrap">Priradiť suplu</button>
                            </div>
                        </div>
                    `;
                } else if (walk.status === 'substituted') {
                    subSection = `
                        <div class="mt-2 pt-2 border-t border-green-200 bg-green-50 p-2 rounded flex justify-between items-center">
                            <span class="text-xs text-green-800 font-medium">✓ Supluje: <b>${walk.substitute}</b> (pôvodne ${walk.person})</span>
                            <button onclick="adminResetSub('${walk.id}')" class="text-xs text-red-600 hover:underline">Zrušiť suplu</button>
                        </div>
                    `;
                } else {
                    subSection = `
                        <div class="mt-2 pt-2 border-t border-gray-100 flex justify-between items-center">
                            <span class="text-xs text-gray-400">Všetko OK</span>
                            <button onclick="adminNeedSub('${walk.id}')" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 px-2.5 py-1 rounded transition">Označiť: Hľadať suplu</button>
                        </div>
                    `;
                }

                const item = document.createElement('div');
                item.className = "bg-gray-50 p-3.5 rounded-lg border flex flex-col gap-1";
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-xs text-indigo-600 font-semibold">${dateFormatted}</div>
                            <div class="text-base font-bold text-gray-800">${walk.person} + ${walk.dog}</div>
                        </div>
                        <button onclick="deleteWalk('${walk.id}')" class="bg-red-500 text-white text-xs px-2.5 py-1 rounded hover:bg-red-600 transition">Zmazať</button>
                    </div>
                    ${subSection}
                `;
                walksList.appendChild(item);
            });
        });

        // Pomocné funkcie pre admina na správu suplovania
        window.deleteWalk = function(id) {
            if (confirm("Naozaj chceš vymazať tento záznam?")) {
                remove(ref(db, 'walks/' + id));
            }
        }

        window.adminNeedSub = function(id) {
            update(ref(db, 'walks/' + id), { status: 'need_sub' });
        }

        window.adminTakeSub = function(id) {
            const input = document.getElementById(`adminSub-${id}`);
            const name = input.value.trim();
            if (!name) {
                alert("Zadaj meno, kto ide suplovať.");
                return;
            }
            update(ref(db, 'walks/' + id), {
                status: 'substituted',
                substitute: name
            });
        }

        window.adminResetSub = function(id) {
            update(ref(db, 'walks/' + id), {
                status: 'ok',
                substitute: ''
            });
        }
    </script>
</body>
</html>
