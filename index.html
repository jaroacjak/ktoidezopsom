<!DOCTYPE html><html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kto ide so psom?</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        color: #1e293b;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 100%;
        max-width: 850px;
        padding: 25px;
    }

    .box {
        background: white;
        border-radius: 24px;
        padding: 55px 40px;
        text-align: center;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        border: 1px solid #e2e8f0;
    }

    .logo {
        width: 100px;
        height: 100px;
        margin: 0 auto 25px;
        background: #e8f0fe;
        border-radius: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 55px;
    }

    h1 {
        font-size: 38px;
        margin-bottom: 12px;
    }

    .subtitle {
        color: #64748b;
        font-size: 17px;
        margin-bottom: 35px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .button {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        font-size: 16px;
        transition: 0.2s;
    }

    .login {
        background: #2563eb;
        color: white;
    }

    .login:hover {
        background: #1d4ed8;
    }

    .register {
        background: #e8f0fe;
        color: #2563eb;
    }

    .register:hover {
        background: #dbeafe;
    }

    .features {
        margin-top: 45px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .feature {
        padding: 20px;
        background: #f8fafc;
        border-radius: 14px;
    }

    .feature-icon {
        font-size: 30px;
        margin-bottom: 10px;
    }

    .feature h3 {
        font-size: 16px;
        margin-bottom: 6px;
    }

    .feature p {
        font-size: 13px;
        color: #64748b;
    }

    footer {
        margin-top: 30px;
        font-size: 12px;
        color: #94a3b8;
    }

    @media (max-width: 650px) {

        .box {
            padding: 40px 20px;
        }

        h1 {
            font-size: 29px;
        }

        .buttons {
            flex-direction: column;
        }

        .button {
            width: 100%;
        }

        .features {
            grid-template-columns: 1fr;
        }
    }
</style>

</head><body><div class="container">

    <div class="box">

        <div class="logo">
            🐶
        </div>

        <h1>Kto ide so psom?</h1>

        <p class="subtitle">
            Jednoduchý systém na organizovanie venčenia psov.
        </p>

        <div class="buttons">

            <a href="login.html" class="button login">
                Prihlásiť sa
            </a>

            <a href="register.html" class="button register">
                Registrovať sa
            </a>

        </div>

        <div class="features">

            <div class="feature">
                <div class="feature-icon">📅</div>
                <h3>Rozpis</h3>
                <p>
                    Prehľad všetkých naplánovaných venčení.
                </p>
            </div>

            <div class="feature">
                <div class="feature-icon">🐶</div>
                <h3>Psy</h3>
                <p>
                    Zoznam psov a informácie o nich.
                </p>
            </div>

            <div class="feature">
                <div class="feature-icon">🔄</div>
                <h3>Suplovanie</h3>
                <p>
                    Admin môže jednoducho nastaviť náhradníka.
                </p>
            </div>

        </div>

        <footer>
            © 2026 Kto ide so psom?
        </footer>

    </div>

</div>

</body>
</html>
