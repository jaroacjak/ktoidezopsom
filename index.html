<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje venčenia - Kto ide so psom</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <!-- Hlavička s odhlásením -->
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800">🐕 Moje priradené venčenia</h1>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded transition">Odhlásiť sa</button>
        </div>
        
        <div class="mb-6 text-xs text-gray-500 bg-gray-50 p-3 rounded-lg border flex justify-between items-center">
            <div>
                <span id="userEmailDisplay" class="block font-semibold text-gray-700">Prihlásený: Načítavam...</span>
                <span id="mappedNameDisplay" class="text-indigo-600 font-bold"></span>
            </div>
        </div>

        <div id="publicWalksList" class="space-y-3">
            <p class="text-gray-500 text-center">Načítavam tvoje venčenia...</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiXQt7bHPI15wp4krGq-GwPz7BfsSvaEE",
            authDomain: "ktoidezopsom.firebaseapp.com",
            databaseURL: "https://ktoidezopsom-default-rtdb.firebaseio.com",
            projectId: "ktoidezopsom",
            storageBucket: "ktoidezopsom.firebasestorage.app",
            messagingSenderId: "354613832067",
            appId: "1:354613832067:web:ddf12b03ed6b4a61d8aeb6",
            measurementId: "G-Z8YC2L3RK7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUserEmail = "";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                currentUserEmail = user.email.toLowerCase();
                document.getElementById('userEmailDisplay').textContent = `E-mail: ${user.email}`;
                
                // Určenie, aké mená v databáze patria tomuto používateľovi
                let targetNames = getTargetNames(currentUserEmail);
                document.getElementById('mappedNameDisplay').textContent = `Zobrazené pre mená: ${targetNames.join(', ')}`;
                
                loadWalks(targetNames);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });

        // Mapovanie e-mailov na mená v databáze (sem si môžeš dopísať ďalších ľudí)
        function getTargetNames(email) {
            if (email.includes("jarko") || email.includes("jaroslav")) {
                return ["jarko", "jaroslav"]; // Ak e-mail obsahuje jarko alebo jaroslav, vyhľadá oboje
            } else if (email.includes("andrej")) {
                return ["andrej"];
            } else {
                // Ak sa nenájde špeciálna zhoda, vezme text pred zavináčom ako meno
                const defaultName = email.split('@')[0];
                return [defaultName];
            }
        }

        const publicWalksList = document.getElementById('publicWalksList');

        function loadWalks(targetNames) {
            onValue(ref(db, 'walks'), (snapshot) => {
                publicWalksList.innerHTML = '';
                const data = snapshot.val();
                
                if (!data) {
                    publicWalksList.innerHTML = '<p class="text-gray-500 text-center">Zatiaľ nie je naplánované žiadne venčenie.</p>';
                    return;
                }

                let walksArray = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

                // FILTROVANIE: Zoberieme iba tie, kde meno v databáze zodpovedá prihlásenému používateľovi
                walksArray = walksArray.filter(walk => {
                    const personInDb = walk.person.toLowerCase();
                    return targetNames.some(name => personInDb.includes(name));
                });

                if (walksArray.length === 0) {
                    publicWalksList.innerHTML = '<p class="text-gray-500 text-center">Nemáš priradené žiadne venčenia.</p>';
                    return;
                }

                walksArray.forEach((walk) => {
                    const dateFormatted = new Date(walk.dateTime).toLocaleString('sk-SK', {
                        weekday: 'short', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    let actionHtml = '';
                    let cardBg = 'bg-indigo-50 border-indigo-100';

                    if (walk.status === 'need_sub') {
                        cardBg = 'bg-amber-50 border-amber-200';
                        actionHtml = `
                            <div class="mt-2 pt-2 border-t border-amber-200 flex gap-2 items-center text-xs text-amber-800 font-medium">
                                ⚠️ Pre tento termín hľadáš suplovanie.
                            </div>
                        `;
                    } else if (walk.status === 'substituted') {
                        cardBg = 'bg-green-50 border-green-200';
                        actionHtml = `
                            <div class="mt-2 text-xs text-green-700 font-medium">
                                ✓ Tento termín za teba supluje: <span class="font-bold">${walk.substitute}</span>
                            </div>
                        `;
                    } else if (walk.status === 'late') {
                        cardBg = 'bg-purple-50 border-purple-200';
                        actionHtml = `
                            <div class="mt-2 text-xs text-purple-700 font-medium">
                                ⏰ Oznámené meškanie: <span class="font-bold">${walk.lateTime}</span>
                            </div>
                        `;
                    } else {
                        // Ak nemôže ísť, môže kliknúť na hľadanie suplovania
                        actionHtml = `
                            <div class="mt-2 pt-2 border-t border-indigo-100 flex justify-end">
                                <button onclick="requestSubstitute('${walk.id}')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded transition font-medium">Nemôžem ísť (Hľadať suplu)</button>
                            </div>
                        `;
                    }

                    const item = document.createElement('div');
                    item.className = `${cardBg} border p-4 rounded-lg shadow-sm flex flex-col justify-between`;
                    item.innerHTML = `
                        <div>
                            <div class="text-xs font-semibold text-indigo-600 uppercase tracking-wide">${dateFormatted}</div>
                            <div class="text-lg font-bold text-gray-800">🐕 Pes: <span class="text-indigo-700">${walk.dog}</span></div>
                        </div>
                        ${actionHtml}
                    `;
                    publicWalksList.appendChild(item);
                });
            });
        }

        window.requestSubstitute = function(id) {
            if (confirm("Naozaj chceš označiť svoj termín, že potrebuje suplovanie?")) {
                update(ref(db, 'walks/' + id), { status: 'need_sub' });
            }
        }
    </script>
</body>
</html>
