<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozpis venčení - Kto ide so psom</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- HLAVNÁ KARTA: Rozpis venčení pre vybraný deň -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-6">
            <!-- Hlavička s odhlásením -->
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold text-gray-800">🐕 Rozpis venčení</h1>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded transition">Odhlásiť sa</button>
            </div>
            
            <div class="mb-4 text-xs text-gray-500 bg-gray-50 p-3 rounded-lg border flex justify-between items-center">
                <div>
                    <span id="userEmailDisplay" class="block font-semibold text-gray-700">Prihlásený: Načítavam...</span>
                    <span id="mappedNameDisplay" class="text-indigo-600 font-bold"></span>
                </div>
            </div>

            <!-- VÝBER DÁTUMU (Kalendár) -->
            <div class="mb-6 bg-indigo-50 border border-indigo-100 p-3.5 rounded-lg flex flex-col sm:flex-row justify-between items-center gap-3">
                <label for="datePicker" class="text-xs font-bold text-indigo-900 uppercase tracking-wide">
                    📅 Dátum venčenia:
                </label>
                <div class="flex gap-2 w-full sm:w-auto">
                    <input type="date" id="datePicker" class="text-sm font-semibold p-2 border rounded-md bg-white shadow-sm focus:ring-2 focus:ring-indigo-500 text-gray-800 w-full">
                    <button id="todayBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded font-medium transition">Dnes</button>
                </div>
            </div>

            <div id="myWalksList" class="space-y-3">
                <p class="text-gray-500 text-center">Načítavam rozpis...</p>
            </div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiXQt7bHPI15wp4krGq-GwPz7BfsSvaEE",
            authDomain: "ktoidezopsom.firebaseapp.com",
            databaseURL: "https://ktoidezopsom-default-rtdb.firebaseio.com",
            projectId: "ktoidezopsom",
            storageBucket: "ktoidezopsom.firebasestorage.app",
            messagingSenderId: "354613832067",
            appId: "1:354613832067:web:ddf12b03ed6b4a61d8aeb6",
            measurementId: "G-Z8YC2L3RK7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUserEmail = "";
        const datePicker = document.getElementById('datePicker');
        const todayBtn = document.getElementById('todayBtn');

        // Nastavenie dnešného dátumu
        function setTodayDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            datePicker.value = `${yyyy}-${mm}-${dd}`;
        }
        setTodayDate();

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                currentUserEmail = user.email.toLowerCase();
                document.getElementById('userEmailDisplay').textContent = `E-mail: ${user.email}`;
                
                let targetNames = getTargetNames(currentUserEmail);
                document.getElementById('mappedNameDisplay').textContent = `Meno v systéme: ${targetNames.join(', ')}`;
                
                loadWalks(targetNames);
            }
        });

        // Tlačidlo Prejsť na dnešok
        todayBtn.addEventListener('click', () => {
            setTodayDate();
            if (currentUserEmail) {
                loadWalks(getTargetNames(currentUserEmail));
            }
        });

        // Reakcia na zmenu dátumu v kalendári
        datePicker.addEventListener('change', () => {
            if (currentUserEmail) {
                loadWalks(getTargetNames(currentUserEmail));
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });

        function getTargetNames(email) {
            if (email.includes("jarko") || email.includes("jaroslav")) {
                return ["jarko", "jaroslav"];
            } else if (email.includes("andrej")) {
                return ["andrej"];
            } else {
                const defaultName = email.split('@')[0];
                return [defaultName];
            }
        }

        const myWalksList = document.getElementById('myWalksList');

        function loadWalks(targetNames) {
            onValue(ref(db, 'walks'), (snapshot) => {
                myWalksList.innerHTML = '';
                
                const data = snapshot.val();
                
                if (!data) {
                    myWalksList.innerHTML = '<p class="text-gray-500 text-center py-4">Zatiaľ nie je naplánované žiadne venčenie.</p>';
                    return;
                }

                const selectedDateStr = datePicker.value;

                let allWalks = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

                // FILTROVANIE VŠETKÝCH VENČENÍ PRE DANNÝ DÁTUM
                const dateFilteredWalks = allWalks.filter(walk => {
                    if (!walk.dateTime) return false;
                    const walkDateStr = walk.dateTime.substring(0, 10);
                    return walkDateStr === selectedDateStr;
                });

                if (dateFilteredWalks.length === 0) {
                    myWalksList.innerHTML = `<p class="text-gray-500 text-center py-4">Pre vybraný dátum (<b>${selectedDateStr}</b>) nie sú naplánované žiadne venčenia.</p>`;
                } else {
                    dateFilteredWalks.forEach((walk) => {
                        const dateFormatted = new Date(walk.dateTime).toLocaleString('sk-SK', {
                            hour: '2-digit', minute: '2-digit'
                        });

                        const personInDb = (walk.person || '').toLowerCase();
                        const isMyWalk = targetNames.some(name => personInDb.includes(name));

                        let actionHtml = '';
                        let cardBg = 'bg-indigo-50 border-indigo-100';

                        // AK VENČENIE NIEKTO SUPLUJE (Zobrazí sa informácia o suplujúcom namiesto pôvodného)
                        if (walk.status === 'substituted') {
                            cardBg = 'bg-emerald-50 border-emerald-300';
                            actionHtml = `
                                <div class="mt-2 text-xs text-emerald-800 font-bold bg-emerald-100 p-2.5 rounded border border-emerald-200">
                                    🤝 Supluje: <span class="text-emerald-900 font-extrabold text-sm">${walk.substitute}</span> (pôvodne: ${walk.person})
                                </div>
                            `;
                        } else if (walk.status === 'late') {
                            cardBg = 'bg-purple-50 border-purple-200';
                            actionHtml = `
                                <div class="mt-2 text-xs text-purple-700 font-medium">
                                    ⏰ Oznámené meškanie: <b>${walk.lateTime}</b>
                                </div>
                            `;
                        } else if (isMyWalk) {
                            // AK JE TO MOJE VENČENIE, MÔŽEM K NEHO PRIRADIŤ SUPLOVANIE
                            actionHtml = `
                                <div class="mt-3 pt-3 border-t border-indigo-100">
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nemôžeš ísť? Priraď suplovanie:</label>
                                    <div class="flex gap-2 items-center">
                                        <input type="text" id="subInput-${walk.id}" placeholder="Meno (napr. Andrej)" class="text-xs p-2 border rounded w-full focus:ring-indigo-500 focus:border-indigo-500">
                                        <button onclick="assignSubstitute('${walk.id}')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-2 rounded font-medium whitespace-nowrap transition">
                                            Zaskočí za mňa
                                        </button>
                                    </div>
                                </div>
                            `;
                        }

                        const item = document.createElement('div');
                        item.className = `${cardBg} border p-4 rounded-lg shadow-sm flex flex-col justify-between`;
                        item.innerHTML = `
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-xs font-bold text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded">⏰ ${dateFormatted}</span>
                                    <span class="text-xs text-gray-500 font-medium">Venčiar: <b>${walk.person}</b></span>
                                </div>
                                <div class="text-lg font-bold text-gray-800 mt-1">🐕 Pes: <span class="text-indigo-700">${walk.dog}</span></div>
                            </div>
                            ${actionHtml}
                        `;
                        myWalksList.appendChild(item);
                    });
                }

            });
        }

        window.assignSubstitute = function(id) {
            const input = document.getElementById(`subInput-${id}`);
            const substituteName = input.value.trim();
            
            if (!substituteName) {
                alert("Prosím, napíš meno človeka, ktorý za teba zaskočí.");
                return;
            }

            update(ref(db, 'walks/' + id), {
                status: 'substituted',
                substitute: substituteName
            });
        }
    </script>
</body>
</html>
